<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(135deg,#dffaff,#fff,#f5e8ff);
color:#222;
min-height:100vh;
}

.container{
max-width:700px;
margin:auto;
padding:25px 16px 50px;
}

header{
text-align:center;
padding:25px 0;
}

.logo{
font-size:30px;
font-weight:800;
direction:ltr;
}

.subtitle{
color:#777;
margin-top:8px;
}

.card{
background:rgba(255,255,255,.9);
border-radius:25px;
padding:22px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input[type=text]{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:14px;
font-size:16px;
outline:none;
}

.upload{
margin-top:18px;
padding:32px 15px;
text-align:center;
border:2px dashed #82d9e8;
border-radius:20px;
background:#f5fdff;
cursor:pointer;
}

.upload strong{
display:block;
font-size:18px;
margin-bottom:8px;
}

.upload span{
color:#777;
font-size:13px;
}

#fileInput{
display:none;
}

.preview{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:18px;
}

.item{
position:relative;
}

.item img{
width:100%;
aspect-ratio:1;
object-fit:cover;
border-radius:14px;
display:block;
}

.number{
position:absolute;
top:5px;
right:5px;
background:#0009;
color:white;
padding:3px 7px;
border-radius:10px;
font-size:11px;
}

button{
width:100%;
padding:15px;
margin-top:18px;
border:0;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#222;
color:white;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.secondary{
background:#eaf8fa;
color:#222;
}

.status{
text-align:center;
margin-top:13px;
color:#666;
font-size:14px;
min-height:20px;
}

.info{
margin-top:15px;
font-size:12px;
color:#777;
line-height:1.7;
}

.count{
margin-top:12px;
font-weight:bold;
text-align:center;
}

@media(max-width:450px){

.logo{
font-size:24px;
}

.preview{
grid-template-columns:repeat(3,1fr);
}

}

</style>
</head>

<body>

<div class="container">

<header>

<div class="logo">
𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚
</div>

<div class="subtitle">
حوّل صورك إلى ملصقات واتساب 🎀
</div>

</header>


<div class="card">

<label>
اسم حزمة الملصقات
</label>

<input
id="packName"
type="text"
placeholder="مثال: Miku Stickers 🎀"
maxlength="60"
>


<label style="margin-top:20px">
اختر الصور
</label>


<div class="upload" id="uploadBox">

<strong>
🖼️ اختر الصور
</strong>

<span>
من 3 إلى 30 صورة
</span>

</div>


<input
id="fileInput"
type="file"
accept="image/png,image/jpeg,image/webp"
multiple
>


<div id="preview" class="preview"></div>

<div id="count" class="count"></div>


<button id="convertBtn" disabled>
🔄 تجهيز الملصقات
</button>


<button
id="downloadBtn"
class="secondary"
disabled
>
📦 تنزيل الحزمة
</button>


<div id="status" class="status"></div>


<div class="info">

واتساب يدعم حزم الملصقات التي تحتوي على 3 إلى 30 ملصقًا.
يتم تجهيز كل صورة بمقاس 512×512 وبصيغة WebP.

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>


<script>

const fileInput =
document.getElementById("fileInput");

const uploadBox =
document.getElementById("uploadBox");

const preview =
document.getElementById("preview");

const convertBtn =
document.getElementById("convertBtn");

const downloadBtn =
document.getElementById("downloadBtn");

const status =
document.getElementById("status");

const count =
document.getElementById("count");

let files=[];
let stickers=[];


uploadBox.onclick=function(){

fileInput.click();

};


fileInput.onchange=function(){

files=
Array.from(fileInput.files)
.filter(file =>
file.type.startsWith("image/")
);

stickers=[];

preview.innerHTML="";

downloadBtn.disabled=true;

files.forEach((file,index)=>{

const item=
document.createElement("div");

item.className="item";


const img=
document.createElement("img");

img.src=
URL.createObjectURL(file);


const number=
document.createElement("div");

number.className="number";

number.textContent=index+1;


item.appendChild(img);

item.appendChild(number);

preview.appendChild(item);

});


count.textContent=
files.length
? `تم اختيار ${files.length} صورة`
: "";


if(files.length<3){

status.textContent=
"اختر 3 صور على الأقل";

convertBtn.disabled=true;

}

else if(files.length>30){

status.textContent=
"الحد الأقصى 30 صورة";

convertBtn.disabled=true;

}

else{

status.textContent=
"الصور جاهزة للتحويل ✨";

convertBtn.disabled=false;

}

};


async function makeSticker(file){

const image=
await createImageBitmap(file);


const canvas=
document.createElement("canvas");

canvas.width=512;
canvas.height=512;


const ctx=
canvas.getContext("2d");

ctx.clearRect(
0,
0,
512,
512
);


const scale=
Math.min(
512/image.width,
512/image.height
);


const width=
image.width*scale;

const height=
image.height*scale;


const x=
(512-width)/2;

const y=
(512-height)/2;


ctx.drawImage(
image,
x,
y,
width,
height
);


image.close();


return new Promise(resolve=>{

canvas.toBlob(
blob=>resolve(blob),
"image/webp",
0.9
);

});

}


convertBtn.onclick=
async function(){

convertBtn.disabled=true;

downloadBtn.disabled=true;

stickers=[];


for(
let i=0;
i<files.length;
i++
){

status.textContent=
`جاري تجهيز الملصق ${i+1} من ${files.length}...`;


const blob=
await makeSticker(files[i]);


stickers.push({

name:
`sticker_${String(i+1).padStart(2,"0")}.webp`,

blob:blob

});

}


status.textContent=
`تم تجهيز ${stickers.length} ملصق بنجاح 🎀`;

convertBtn.disabled=false;

downloadBtn.disabled=false;

};


downloadBtn.onclick=
async function(){

if(!stickers.length)return;


const name=
document.getElementById("packName")
.value
.trim()
||
"Miku Stickers";


const zip=
new JSZip();


const folder=
zip.folder("stickers");


stickers.forEach(sticker=>{

folder.file(
sticker.name,
sticker.blob
);

});


zip.file(
"pack-info.txt",

`𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚

اسم الحزمة:
${name}

عدد الملصقات:
${stickers.length}

المقاس:
512×512

الصيغة:
WebP`
);


status.textContent=
"جاري إنشاء الحزمة...";


const blob=
await zip.generateAsync({
type:"blob"
});


const link=
document.createElement("a");


link.href=
URL.createObjectURL(blob);


link.download=
name
.replace(/[\\/:*?"<>|]/g,"_")
+"_stickers.zip";


link.click();


status.textContent=
"تم تنزيل الحزمة 📦✨";

};

</script>

</body>
</html>
