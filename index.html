<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="Miku Stickers - تحويل الصور وGIF إلى ملصقات WhatsApp"
  >

  <title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <main class="container">

    <!-- ==============================
         HEADER
    =============================== -->

    <header>

      <h1>
        𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚
      </h1>

      <p>
        حوّل صورك وGIF إلى ملصقات WhatsApp
      </p>

    </header>


    <!-- ==============================
         MAIN CARD
    =============================== -->

    <section class="card">

      <!-- Pack name -->

      <div class="field">

        <label for="packName">
          اسم حزمة الملصقات
        </label>

        <input
          id="packName"
          type="text"
          maxlength="64"
          autocomplete="off"
          placeholder="Miku Stickers"
        >

      </div>


      <!-- Upload -->

      <label
        class="upload"
        for="fileInput"
      >

        <span class="upload-icon">
          ＋
        </span>

        <span>
          اختر من 3 إلى 30 صورة أو GIF
        </span>

        <small>
          PNG / JPG / WEBP / GIF
        </small>

      </label>


      <!-- File input -->

      <input
        id="fileInput"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
        multiple
        hidden
      >


      <!-- Status -->

      <div
        id="status"
        class="status"
        aria-live="polite"
      >
        اختر من 3 إلى 30 صورة أو GIF.
      </div>


      <!-- Preview -->

      <section
        id="preview"
        class="preview"
        aria-label="معاينة الملصقات"
      ></section>


      <!-- Create -->

      <button
        id="createButton"
        type="button"
        disabled
      >
        إنشاء حزمة الملصقات
      </button>


      <!-- Bridge status -->

      <div
        id="bridgeStatus"
        class="bridge-status"
        aria-live="polite"
      >
        Miku Stickers جاهز.
      </div>


      <!-- Share -->

      <button
        id="whatsappButton"
        class="secondary"
        type="button"
        disabled
      >
        مشاركة إلى Sticker Maker
      </button>

    </section>


    <!-- ==============================
         STICKER INFO
    =============================== -->

    <section class="info">

      <div class="info-item">

        <strong>
          512×512
        </strong>

        <span>
          أبعاد الملصق
        </span>

      </div>


      <div class="info-item">

        <strong>
          ≤100KB
        </strong>

        <span>
          الملصق الثابت
        </span>

      </div>


      <div class="info-item">

        <strong>
          ≤500KB
        </strong>

        <span>
          الملصق المتحرك
        </span>

      </div>

    </section>


    <!-- ==============================
         FILE INFO
    =============================== -->

    <section class="info">

      <div class="info-item">

        <strong>
          3–30
        </strong>

        <span>
          عدد الملصقات
        </span>

      </div>


      <div class="info-item">

        <strong>
          WebP
        </strong>

        <span>
          صيغة الصور
        </span>

      </div>


      <div class="info-item">

        <strong>
          GIF
        </strong>

        <span>
          ملفات متحركة
        </span>

      </div>

    </section>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

      <p>
        𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚
      </p>

    </footer>

  </main>


  <!-- ==============================
       JSZip
       يستخدم لاحقًا لتجميع الحزمة
  =============================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
  ></script>


  <!-- ==============================
       APP
  =============================== -->

  <script
    type="module"
    src="js/app.js"
  ></script>

</body>

</html>
