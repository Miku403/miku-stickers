<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Miku Stickers</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <main class="container">

    <header>
      <h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>

      <p>
        حوّل صورك إلى ملصقات واتساب
      </p>
    </header>

    <section class="card">

      <label for="packName">
        اسم الحزمة
      </label>

      <input
        id="packName"
        type="text"
        maxlength="64"
        placeholder="Miku Stickers"
      >

      <label
        class="upload"
        for="fileInput"
      >

        <span class="upload-icon">
          ＋
        </span>

        <span>
          اختر من 3 إلى 30 صورة
        </span>

      </label>

      <input
        id="fileInput"
        type="file"
        accept="image/*"
        multiple
        hidden
      >

      <div id="status"></div>

      <div
        id="preview"
        class="preview"
      ></div>

      <button
        id="createButton"
        disabled
      >
        إنشاء حزمة الملصقات
      </button>

      <button
        id="whatsappButton"
        class="secondary"
        disabled
      >
        إضافة إلى WhatsApp
      </button>

    </section>

  </main>

  <script type="module" src="js/app.js"></script>

</body>

</html>
