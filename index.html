<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f3f3f3;
      color:#111;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:25px 16px 50px;
    }

    h1{
      text-align:center;
      margin-bottom:25px;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 4px 15px rgba(0,0,0,.08);
    }

    input[type="text"]{
      width:100%;
      padding:14px;
      border:1px solid #ddd;
      border-radius:12px;
      font-size:16px;
      margin-bottom:15px;
    }

    input[type="file"]{
      width:100%;
      padding:10px 0;
    }

    button{
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
      background:#111;
      color:white;
    }

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .green{
      background:#20c86b;
    }

    .orange{
      background:#ff8a00;
    }

    .preview{
      display:grid;
      grid-template-columns:
        repeat(auto-fill,minmax(120px,1fr));
      gap:12px;
      margin-top:20px;
    }

    .sticker{
      background:#fafafa;
      border-radius:14px;
      padding:8px;
      text-align:center;
    }

    .sticker img{
      width:100%;
      aspect-ratio:1;
      object-fit:contain;
      border-radius:10px;
      background:#eee;
    }

    .sticker button{
      font-size:13px;
      padding:9px;
    }

    .status{
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      background:#f1f1f1;
      text-align:center;
      white-space:pre-wrap;
    }

    .small{
      font-size:13px;
      color:#666;
      line-height:1.7;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>


  <div class="card">

    <input
      id="packName"
      type="text"
      placeholder="اسم حزمة الملصقات"
      maxlength="128"
    >

    <input
      id="fileInput"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      multiple
    >

    <button
      id="convertBtn"
      disabled
    >
      تحويل الصور إلى ملصقات
    </button>

    <button
      id="zipBtn"
      class="green"
      disabled
    >
      📦 تحميل حزمة .wastickers
    </button>

    <button
      id="directBtn"
      class="orange"
      disabled
    >
      🧪 تجربة إرسال الحزمة مباشرة إلى WhatsApp
    </button>

    <div
      id="status"
      class="status"
    >
      اختر من 3 إلى 30 صورة.
    </div>

  </div>


  <div class="card">

    <div class="small">
      المعاينة
    </div>

    <div
      id="preview"
      class="preview"
    ></div>

  </div>

</div>


<script>

const fileInput =
  document.getElementById("fileInput");

const convertBtn =
  document.getElementById("convertBtn");

const zipBtn =
  document.getElementById("zipBtn");

const directBtn =
  document.getElementById("directBtn");

const preview =
  document.getElementById("preview");

const status =
  document.getElementById("status");

const packName =
  document.getElementById("packName");


let stickerArray = [];

let trayImage = null;


/*
========================================
STATUS
========================================
*/

function setStatus(text){

  status.textContent = text;

}


/*
========================================
IMAGE -> WEBP 512x512
========================================
*/

async function makeSticker(file){

  const image =
    await createImageBitmap(file);


  const MAX_SIZE =
    100 * 1024;


  const canvas =
    document.createElement("canvas");


  canvas.width = 512;
  canvas.height = 512;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    512,
    512
  );


  const margin = 16;

  const available =
    512 - (margin * 2);


  const scale =
    Math.min(
      available / image.width,
      available / image.height
    );


  const width =
    image.width * scale;


  const height =
    image.height * scale;


  const x =
    (512 - width) / 2;


  const y =
    (512 - height) / 2;


  ctx.drawImage(
    image,
    x,
    y,
    width,
    height
  );


  image.close();


  function convert(quality){

    return new Promise(resolve => {

      canvas.toBlob(
        blob => resolve(blob),
        "image/webp",
        quality
      );

    });

  }


  let blob =
    await convert(0.92);


  if(blob.size <= MAX_SIZE){

    return blob;

  }


  let low = 0.05;

  let high = 0.90;

  let bestBlob = null;


  for(let i = 0; i < 12; i++){

    const quality =
      (low + high) / 2;


    blob =
      await convert(quality);


    if(blob.size <= MAX_SIZE){

      bestBlob = blob;

      low = quality;

    }else{

      high = quality;

    }

  }


  if(bestBlob){

    return bestBlob;

  }


  return await convert(0.01);

}


/*
========================================
TRAY IMAGE
========================================
*/

async function createTray(){

  const canvas =
    document.createElement("canvas");


  canvas.width = 96;

  canvas.height = 96;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    96,
    96
  );


  if(stickerArray.length > 0){

    const blob =
      stickerArray[0].blob;


    const url =
      URL.createObjectURL(blob);


    const image =
      await new Promise(resolve => {

        const img =
          new Image();

        img.onload = () => resolve(img);

        img.src = url;

      });


    const scale =
      Math.min(
        80 / image.width,
        80 / image.height
      );


    const width =
      image.width * scale;


    const height =
      image.height * scale;


    const x =
      (96 - width) / 2;


    const y =
      (96 - height) / 2;


    ctx.drawImage(
      image,
      x,
      y,
      width,
      height
    );


    URL.revokeObjectURL(url);

  }


  return new Promise(resolve => {

    canvas.toBlob(
      blob => resolve(blob),
      "image/png"
    );

  });

}


/*
========================================
FILE SELECTION
========================================
*/

fileInput.addEventListener(
  "change",
  () => {

    const files =
      Array.from(fileInput.files);


    stickerArray = [];

    trayImage = null;

    preview.innerHTML = "";


    zipBtn.disabled = true;

    directBtn.disabled = true;


    if(
      files.length < 3 ||
      files.length > 30
    ){

      convertBtn.disabled = true;

      setStatus(
        "لازم تختار من 3 إلى 30 صورة."
      );

      return;

    }


    convertBtn.disabled = false;


    setStatus(
      `تم اختيار ${files.length} صور.\nاضغط تحويل.`
    );

  }
);


/*
========================================
CONVERT
========================================
*/

convertBtn.addEventListener(
  "click",
  async () => {

    try{

      convertBtn.disabled = true;

      zipBtn.disabled = true;

      directBtn.disabled = true;

      stickerArray = [];

      preview.innerHTML = "";


      const files =
        Array.from(fileInput.files);


      for(
        let i = 0;
        i < files.length;
        i++
      ){

        setStatus(
          `جاري تحويل الملصق ${i + 1} من ${files.length}...`
        );


        const blob =
          await makeSticker(files[i]);


        stickerArray.push({

          blob: blob,

          name:
            `sticker_${String(i + 1).padStart(2,"0")}.webp`

        });


        const url =
          URL.createObjectURL(blob);


        const box =
          document.createElement("div");


        box.className =
          "sticker";


        const img =
          document.createElement("img");


        img.src = url;


        const label =
          document.createElement("div");


        label.className =
          "small";


        label.textContent =
          `${i + 1} — ${(blob.size / 1024).toFixed(1)} KB`;


        const share =
          document.createElement("button");


        share.textContent =
          "مشاركة";


        share.addEventListener(
          "click",
          async () => {

            try{

              const file =
                new File(
                  [blob],
                  `sticker_${i + 1}.webp`,
                  {
                    type:"image/webp"
                  }
                );


              if(
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                  files:[file]
                })
              ){

                await navigator.share({
                  files:[file],
                  title:"Miku Sticker"
                });

              }else{

                setStatus(
                  "المشاركة غير مدعومة في هذا المتصفح."
                );

              }

            }catch(error){

              console.log(error);

            }

          }
        );


        box.appendChild(img);

        box.appendChild(label);

        box.appendChild(share);

        preview.appendChild(box);

      }


      trayImage =
        await createTray();


      zipBtn.disabled = false;

      directBtn.disabled = false;


      setStatus(
        `تم تحويل ${stickerArray.length} ملصق بنجاح.\nكل ملصق 512×512.`
      );


    }catch(error){

      console.error(error);

      setStatus(
        "حدث خطأ أثناء التحويل:\n" +
        error.message
      );

      convertBtn.disabled = false;

    }

  }
);


/*
========================================
CREATE .WASTICKERS
========================================
*/

zipBtn.addEventListener(
  "click",
  async () => {

    try{

      if(
        stickerArray.length < 3
      ){

        setStatus(
          "لازم يكون عندك 3 ملصقات على الأقل."
        );

        return;

      }


      setStatus(
        "جاري إنشاء الحزمة..."
      );


      const zip =
        new JSZip();


      const name =
        packName.value.trim() ||
        "Miku Stickers";


      zip.file(
        "title.txt",
        name
      );


      zip.file(
        "author.txt",
        "Miku Stickers"
      );


      zip.file(
        "cover.png",
        trayImage
      );


      stickerArray.forEach(
        sticker => {

          zip.file(
            sticker.name,
            sticker.blob
          );

        }
      );


      const result =
        await zip.generateAsync({
          type:"blob"
        });


      const url =
        URL.createObjectURL(result);


      const a =
        document.createElement("a");


      a.href = url;

      a.download =
        "miku-stickers.wastickers";


      document.body.appendChild(a);

      a.click();

      a.remove();


      URL.revokeObjectURL(url);


      setStatus(
        "تم إنشاء ملف .wastickers بنجاح."
      );


    }catch(error){

      console.error(error);

      setStatus(
        "فشل إنشاء الحزمة:\n" +
        error.message
      );

    }

  }
);


/*
========================================
BASE64 HELPER
========================================
*/

function blobToBase64(blob){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onloadend = () => {

        const result =
          reader.result;


        const base64 =
          result.split(",")[1];


        resolve(base64);

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(blob);

    }
  );

}


/*
========================================
DIRECT WHATSAPP TEST
========================================
*/

directBtn.addEventListener(
  "click",
  async () => {

    try{

      if(
        stickerArray.length < 3
      ){

        setStatus(
          "لازم يكون عندك 3 ملصقات على الأقل."
        );

        return;

      }


      setStatus(
        "جاري تجهيز بيانات WhatsApp..."
      );


      /*
      --------------------------------
      Build sticker data
      --------------------------------
      */

      const stickers = [];


      for(
        const sticker of stickerArray
      ){

        const imageData =
          await blobToBase64(
            sticker.blob
          );


        stickers.push({

          image_data:
            imageData,

          emojis:
            ["😀"]

        });

      }


      /*
      --------------------------------
      Tray PNG -> Base64
      --------------------------------
      */

      const trayBase64 =
        await blobToBase64(
          trayImage
        );


      /*
      --------------------------------
      Official-style JSON structure
      --------------------------------
      */

      const whatsappPack = {

        identifier:
          "miku_stickers_" +
          Date.now(),

        name:
          packName.value.trim() ||
          "Miku Stickers",

        publisher:
          "Miku Stickers",

        tray_image:
          trayBase64,

        stickers:
          stickers

      };


      console.log(
        "WhatsApp Pack:",
        whatsappPack
      );


      /*
      --------------------------------
      IMPORTANT:
      Browser Clipboard API attempt
      --------------------------------
      */

      if(
        !navigator.clipboard ||
        !window.ClipboardItem
      ){

        throw new Error(
          "Clipboard API غير مدعومة في هذا المتصفح."
        );

      }


      const jsonText =
        JSON.stringify(
          whatsappPack
        );


      /*
      Try to expose the data
      using WhatsApp's UTI.
      */

      const stickerBlob =
        new Blob(
          [jsonText],
          {
            type:
              "net.whatsapp.third-party.sticker-pack"
          }
        );


      const clipboardItem =
        new ClipboardItem({

          "net.whatsapp.third-party.sticker-pack":
            stickerBlob

        });


      await navigator.clipboard.write([
        clipboardItem
      ]);


      setStatus(
        "تم وضع البيانات في Clipboard.\n" +
        "جاري فتح WhatsApp..."
      );


      /*
      --------------------------------
      Open WhatsApp
      --------------------------------
      */

      setTimeout(
        () => {

          window.location.href =
            "whatsapp://stickerPack";

        },
        300
      );


    }catch(error){

      console.error(error);


      setStatus(
        "فشل الإرسال المباشر:\n" +
        error.message
      );

    }

  }
);

</script>

</body>
</html>
