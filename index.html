<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Miku Stickers Test</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f4f4f7;
      color: #111;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    .upload {
      display: block;
      padding: 30px 15px;
      border: 2px dashed #999;
      border-radius: 18px;
      cursor: pointer;
      margin: 20px 0;
    }

    .upload input {
      display: none;
    }

    #status {
      margin: 20px 0;
      font-weight: bold;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    #preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>

    <label class="upload">

      <strong>
        اختر الصور
      </strong>

      <br>

      <small>
        اختر من 3 إلى 30 صورة
      </small>

      <input
        id="fileInput"
        type="file"
        accept="image/*"
        multiple
      >

    </label>

    <div id="status">
      لم يتم اختيار صور.
    </div>

    <div id="preview"></div>

  </div>


  <script>

    const fileInput =
      document.getElementById("fileInput");

    const status =
      document.getElementById("status");

    const preview =
      document.getElementById("preview");


    fileInput.addEventListener(
      "change",
      function () {

        const files =
          Array.from(
            fileInput.files || []
          );


        preview.innerHTML = "";


        if (files.length === 0) {

          status.textContent =
            "لم يتم اختيار صور.";

          return;
        }


        status.textContent =
          `تم اختيار ${files.length} صورة`;


        files.forEach(
          function (file) {

            const img =
              document.createElement("img");


            img.src =
              URL.createObjectURL(file);


            preview.appendChild(img);

          }
        );

      }
    );

  </script>

</body>

</html>
