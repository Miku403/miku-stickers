<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 15px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input[type="text"]{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
}

input[type="file"]{
  width:100%;
  margin-bottom:15px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#convertBtn{
  background:#111;
  color:white;
}

#packBtn{
  background:#25d366;
  color:white;
}

#directBtn{
  background:#128c7e;
  color:white;
}

.status{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  line-height:1.7;
}

.preview{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
  margin-top:15px;
}

.sticker{
  background:#fafafa;
  border-radius:12px;
  padding:8px;
  text-align:center;
}

.sticker img{
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
  border-radius:10px;
}

.sticker button{
  background:#333;
  color:white;
  font-size:13px;
  padding:9px;
}

.small{
  font-size:13px;
  color:#777;
  line-height:1.6;
}

.warning{
  background:#fff7d6;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
  font-size:13px;
  line-height:1.7;
}

</style>
</head>


<body>

<div class="container">

<h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>


<div class="card">

<label>
اسم حزمة الملصقات
</label>

<input
  id="packName"
  type="text"
  placeholder="Miku Stickers"
>


<label>
اختر من 3 إلى 30 صورة
</label>

<input
  id="fileInput"
  type="file"
  accept="image/*"
  multiple
>


<button id="convertBtn">
تحويل الملصقات
</button>


<div
  id="status"
  class="status"
>
جاهز
</div>

</div>


<div class="card">

<h3>
المعاينة
</h3>

<div
  id="preview"
  class="preview"
></div>

</div>


<div class="card">

<button
  id="directBtn"
  disabled
>
🧪 تجربة إرسال الحزمة مباشرة إلى WhatsApp
</button>


<button
  id="packBtn"
  disabled
>
📦 تحميل حزمة .wastickers
</button>


<p class="small">
التجربة المباشرة تحاول تمرير بيانات حزمة
WhatsApp إلى Clipboard ثم فتح WhatsApp.
</p>


<div class="warning">

⚠️ هذه تجربة. إذا رفض Chrome نوع البيانات
أو رفض WhatsApp الحزمة، سيظهر الخطأ.

</div>

</div>

</div>


<script>


/* =========================
   العناصر
========================= */

const fileInput =
  document.getElementById("fileInput");

const convertBtn =
  document.getElementById("convertBtn");

const packBtn =
  document.getElementById("packBtn");

const directBtn =
  document.getElementById("directBtn");

const preview =
  document.getElementById("preview");

const status =
  document.getElementById("status");

const packName =
  document.getElementById("packName");


let files = [];

let stickers = [];


/* =========================
   تحويل الصورة
   512 × 512
   أقل من أو يساوي 100KB
========================= */

async function makeSticker(file){

  const image =
    await createImageBitmap(file);


  const MAX_SIZE =
    100 * 1024;


  const canvas =
    document.createElement("canvas");

  canvas.width = 512;
  canvas.height = 512;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    512,
    512
  );


  const margin = 16;

  const available =
    512 - (margin * 2);


  const scale =
    Math.min(
      available / image.width,
      available / image.height
    );


  const width =
    image.width * scale;

  const height =
    image.height * scale;


  const x =
    (512 - width) / 2;

  const y =
    (512 - height) / 2;


  ctx.drawImage(
    image,
    x,
    y,
    width,
    height
  );


  image.close();


  function convert(quality){

    return new Promise(resolve => {

      canvas.toBlob(
        blob => resolve(blob),
        "image/webp",
        quality
      );

    });

  }


  let blob =
    await convert(0.92);


  if(blob.size <= MAX_SIZE){
    return blob;
  }


  let low = 0.05;

  let high = 0.90;

  let bestBlob = null;


  for(
    let i = 0;
    i < 12;
    i++
  ){

    const quality =
      (low + high) / 2;


    blob =
      await convert(quality);


    if(
      blob.size <= MAX_SIZE
    ){

      bestBlob = blob;

      low = quality;

    }else{

      high = quality;

    }

  }


  if(bestBlob){
    return bestBlob;
  }


  return await convert(0.01);

}


/* =========================
   الغلاف
   96 × 96 PNG
========================= */

async function makeCover(file){

  const image =
    await createImageBitmap(file);


  const canvas =
    document.createElement("canvas");


  canvas.width = 96;
  canvas.height = 96;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    96,
    96
  );


  const scale =
    Math.min(
      96 / image.width,
      96 / image.height
    );


  const width =
    image.width * scale;


  const height =
    image.height * scale;


  const x =
    (96 - width) / 2;


  const y =
    (96 - height) / 2;


  ctx.drawImage(
    image,
    x,
    y,
    width,
    height
  );


  image.close();


  return new Promise(resolve => {

    canvas.toBlob(
      blob => resolve(blob),
      "image/png"
    );

  });

}


/* =========================
   Blob → Base64
========================= */

function blobToBase64(blob){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onloadend =
        () => {

          const result =
            reader.result;


          const base64 =
            result.split(",")[1];


          resolve(base64);

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(blob);

    }
  );

}


/* =========================
   المعاينة
========================= */

function renderPreview(){

  preview.innerHTML = "";


  stickers.forEach(
    (sticker,index) => {

      const div =
        document.createElement("div");


      div.className =
        "sticker";


      const img =
        document.createElement("img");


      img.src =
        URL.createObjectURL(
          sticker.blob
        );


      const button =
        document.createElement("button");


      button.textContent =
        "مشاركة";


      button.addEventListener(
        "click",
        async () => {

          const file =
            new File(
              [sticker.blob],
              `miku-${index + 1}.webp`,
              {
                type:
                  "image/webp"
              }
            );


          if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
              files:[file]
            })
          ){

            try{

              await navigator.share({
                files:[file],
                title:
                  "Miku Sticker"
              });

            }catch(error){

              console.log(error);

            }

          }else{

            status.textContent =
              "المشاركة غير مدعومة في هذا المتصفح.";

          }

        }
      );


      div.appendChild(img);

      div.appendChild(button);

      preview.appendChild(div);

    }
  );

}


/* =========================
   اختيار الصور
========================= */

fileInput.addEventListener(
  "change",
  () => {

    files =
      Array.from(
        fileInput.files
      );


    stickers = [];

    preview.innerHTML = "";


    if(
      files.length < 3 ||
      files.length > 30
    ){

      status.textContent =
        "❌ يجب اختيار من 3 إلى 30 صورة.";

      return;

    }


    status.textContent =
      `تم اختيار ${files.length} صورة.`;

  }
);


/* =========================
   التحويل
========================= */

convertBtn.addEventListener(
  "click",
  async () => {

    if(
      files.length < 3 ||
      files.length > 30
    ){

      status.textContent =
        "❌ اختر من 3 إلى 30 صورة أولًا.";

      return;

    }


    convertBtn.disabled = true;

    packBtn.disabled = true;

    directBtn.disabled = true;


    stickers = [];


    try{

      for(
        let i = 0;
        i < files.length;
        i++
      ){

        status.textContent =
          `⏳ تحويل الملصق ${i + 1} من ${files.length}...`;


        const blob =
          await makeSticker(
            files[i]
          );


        stickers.push({
          blob: blob
        });

      }


      renderPreview();


      packBtn.disabled = false;

      directBtn.disabled = false;


      status.textContent =
        `✅ تم تحويل ${stickers.length} ملصق بنجاح — 512×512`;

    }catch(error){

      console.error(error);


      status.textContent =
        "❌ حدث خطأ: " +
        error.message;

    }


    convertBtn.disabled = false;

  }
);


/* =========================
   إنشاء wastickers
========================= */

packBtn.addEventListener(
  "click",
  async () => {

    if(
      stickers.length < 3
    ){
      return;
    }


    packBtn.disabled = true;

    directBtn.disabled = true;


    try{

      status.textContent =
        "📦 تجهيز حزمة WhatsApp...";


      const zip =
        new JSZip();


      const name =
        packName.value.trim() ||
        "Miku Stickers";


      const coverBlob =
        await makeCover(
          files[0]
        );


      zip.file(
        "cover.png",
        coverBlob
      );


      zip.file(
        "title.txt",
        name
      );


      zip.file(
        "author.txt",
        "Miku Stickers"
      );


      for(
        let i = 0;
        i < stickers.length;
        i++
      ){

        zip.file(
          `${String(i).padStart(2,"0")}.webp`,
          stickers[i].blob
        );

      }


      const blob =
        await zip.generateAsync({
          type:"blob"
        });


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");


      a.href = url;


      a.download =
        `${name}.wastickers`;


      a.click();


      setTimeout(
        () => {

          URL.revokeObjectURL(url);

        },
        1000
      );


      status.textContent =
        "✅ تم إنشاء حزمة .wastickers.";

    }catch(error){

      console.error(error);


      status.textContent =
        "❌ خطأ في إنشاء الحزمة: " +
        error.message;

    }


    packBtn.disabled = false;

    directBtn.disabled = false;

  }
);


/* =========================
   WhatsApp DIRECT TEST
========================= */

directBtn.addEventListener(
  "click",
  async () => {

    if(
      stickers.length < 3
    ){
      return;
    }


    directBtn.disabled = true;

    packBtn.disabled = true;


    try{

      status.textContent =
        "🧪 تجهيز بيانات WhatsApp...";


      /*
       * إنشاء صورة الغلاف
       */

      const coverBlob =
        await makeCover(
          files[0]
        );


      const trayImage =
        await blobToBase64(
          coverBlob
        );


      /*
       * إنشاء بيانات الملصقات
       */

      const stickerArray = [];


      for(
        let i = 0;
        i < stickers.length;
        i++
      ){

        status.textContent =
          `🧪 تجهيز الملصق ${i + 1} من ${stickers.length}...`;


        const imageData =
          await blobToBase64(
            stickers[i].blob
          );


        stickerArray.push({

          image_data:
            imageData,

          emojis:
            ["🎀"],

          accessibility_text:
            `Miku sticker ${i + 1}`

        });

      }


      /*
       * بيانات الحزمة
       */

      const whatsappPack = {

        identifier:
          "miku_stickers_" +
          Date.now(),

        name:
          packName.value.trim() ||
          "Miku Stickers",

        publisher:
          "Miku Stickers",

        tray_image:
          trayImage,

        stickers:
          stickerArray,

        ios_app_store_link:
          "",

        android_play_store_link:
          ""

      };


      /*
       * تحويل JSON إلى نص
       */

      const jsonText =
        JSON.stringify(
          whatsappPack
        );


      console.log(
        "========== WhatsApp Pack =========="
      );


      console.log(
        whatsappPack
      );


      console.log(
        "JSON length:",
        jsonText.length
      );


      /*
       * التأكد من توفر Clipboard
       */

      if(
        !navigator.clipboard
      ){

        throw new Error(
          "Clipboard API غير متاحة."
        );

      }


      if(
        !window.ClipboardItem
      ){

        throw new Error(
          "ClipboardItem غير مدعوم."
        );

      }


      /*
       * محاولة Web Clipboard
       *
       * النوع الخارجي هو نوع WhatsApp
       * والمحتوى نفسه JSON.
       */

      const clipboardItem =
        new ClipboardItem({

          "net.whatsapp.third-party.sticker-pack":

            new Blob(
              [jsonText],
              {
                type:
                  "text/plain"
              }
            )

        });


      status.textContent =
        "📋 محاولة تمرير بيانات الحزمة إلى WhatsApp...";


      /*
       * كتابة الحزمة
       */

      await navigator.clipboard.write([
        clipboardItem
      ]);


      console.log(
        "Clipboard write succeeded."
      );


      status.textContent =
        "✅ تم قبول بيانات الحزمة — جاري فتح WhatsApp...";


      /*
       * فتح WhatsApp
       */

      setTimeout(
        () => {

          window.location.href =
            "whatsapp://stickerPack";

        },
        300
      );


    }catch(error){

      console.error(
        "WhatsApp direct error:",
        error
      );


      status.textContent =
        "❌ فشلت محاولة تمرير الحزمة: " +
        error.name +
        " — " +
        error.message;


      directBtn.disabled = false;

      packBtn.disabled = false;

    }

  }
);

</script>

</body>
</html>
