<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:Arial,sans-serif;
}

.container{
  width:min(900px,92%);
  margin:30px auto;
}

h1{
  text-align:center;
  font-size:32px;
  margin:0;
}

.subtitle{
  text-align:center;
  color:#777;
  margin:10px 0 25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

#packName{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:18px;
}

.upload{
  position:relative;
  min-height:150px;
  border:2px dashed #aaa;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  overflow:hidden;
}

.upload strong{
  font-size:20px;
  margin-bottom:8px;
}

.upload span{
  color:#777;
}

#fileInput{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
}

.count{
  text-align:center;
  font-weight:bold;
  margin:15px 0;
}

.preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.preview-item{
  aspect-ratio:1;
  border-radius:14px;
  overflow:hidden;
  background:#eee;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:contain;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

#convertBtn{
  background:#222;
  color:white;
}

button:disabled{
  opacity:.45;
}

.status{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}

/* =========================
   الملصقات الناتجة
========================= */

#resultSection{
  display:none;
  margin-top:25px;
}

.resultTitle{
  font-size:21px;
  font-weight:bold;
  margin-bottom:12px;
}

.stickers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.sticker{
  background:#f2f2f2;
  border-radius:16px;
  padding:8px;
  text-align:center;
}

.sticker img{
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
  display:block;
  border-radius:10px;
}

.sticker button{
  margin-top:8px;
  padding:10px;
  font-size:14px;
  background:#1677ff;
  color:white;
}

.size{
  font-size:11px;
  color:#777;
  margin-top:5px;
}

.info{
  margin-top:20px;
  padding:14px;
  border-radius:13px;
  background:#f7f7f7;
  color:#666;
  font-size:13px;
  line-height:1.7;
}
</style>
</head>

<body>

<div class="container">

<h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>

<div class="subtitle">
حوّل صورك إلى ملصقات 🎀
</div>

<div class="card">

<label class="title">
اسم حزمة الملصقات
</label>

<input
id="packName"
type="text"
placeholder="مثلاً: Miku Stickers"
maxlength="40"
>

<label class="upload">

<input
id="fileInput"
type="file"
accept="image/*"
multiple
>

<strong>🖼️ اختر الصور</strong>

<span>
من 3 إلى 30 صورة
</span>

</label>

<div
id="count"
class="count">
</div>

<div
id="preview"
class="preview">
</div>

<button
id="convertBtn"
disabled>
⚙️ تحويل إلى ملصقات
</button>

<div
id="status"
class="status">
</div>


<div
id="resultSection">

<div class="resultTitle">
🎀 ملصقاتك الجاهزة
</div>

<div
id="stickers"
class="stickers">
</div>

</div>


<div class="info">

كل ملصق يتم تحويله إلى
512×512 WebP.

بعد ظهور الملصقات اضغط على
<strong>مشاركة</strong> لكل ملصق
واحفظه أو أرسله إلى المكان الذي تريده.

</div>

</div>

</div>


<script>

const fileInput =
document.getElementById("fileInput");

const preview =
document.getElementById("preview");

const count =
document.getElementById("count");

const convertBtn =
document.getElementById("convertBtn");

const status =
document.getElementById("status");

const resultSection =
document.getElementById("resultSection");

const stickersContainer =
document.getElementById("stickers");

let files = [];
let stickers = [];


/* =========================
   اختيار الصور
========================= */

fileInput.addEventListener(
"change",
function(){

let selected =
Array.from(
fileInput.files || []
);

selected =
selected.filter(
file =>
file.type.startsWith("image/")
);

if(selected.length > 30){

selected =
selected.slice(0,30);

}

files = selected;

preview.innerHTML = "";

stickersContainer.innerHTML = "";

resultSection.style.display =
"none";


if(files.length === 0){

count.textContent = "";

convertBtn.disabled = true;

return;

}


count.textContent =
`تم اختيار ${files.length} صورة`;


if(files.length < 3){

count.textContent +=
" — اختر 3 صور على الأقل";

convertBtn.disabled = true;

}else{

convertBtn.disabled = false;

}


files.forEach(
(file,index)=>{

const item =
document.createElement("div");

item.className =
"preview-item";


const img =
document.createElement("img");

const url =
URL.createObjectURL(file);

img.src = url;

img.onload = () => {

URL.revokeObjectURL(url);

};


item.appendChild(img);

preview.appendChild(item);

});

});


/* =========================
   تحويل الصورة
========================= */

async function makeSticker(file){

const image =
await createImageBitmap(file);

const canvas =
document.createElement("canvas");

canvas.width = 512;
canvas.height = 512;

const ctx =
canvas.getContext("2d");

ctx.clearRect(
0,
0,
512,
512
);


const scale =
Math.min(
512 / image.width,
512 / image.height
);

const width =
image.width * scale;

const height =
image.height * scale;

const x =
(512 - width) / 2;

const y =
(512 - height) / 2;


ctx.drawImage(
image,
x,
y,
width,
height
);

image.close();


/*
  نحاول ضغط الملف
  ليكون مناسبًا للملصقات.
*/

const qualities = [
0.90,
0.82,
0.75,
0.68,
0.60,
0.52,
0.45,
0.38
];

let blob;

for(
const quality of qualities
){

blob =
await new Promise(
resolve => {

canvas.toBlob(
result =>
resolve(result),
"image/webp",
quality
);

});

if(
blob.size <=
100 * 1024
){

break;

}

}


return blob;

}


/* =========================
   مشاركة ملصق
========================= */

async function shareSticker(
sticker,
index
){

const file =
new File(
[sticker.blob],
sticker.name,
{
type:"image/webp"
}
);


try{

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

title:
`Sticker ${index + 1}`,

files:[file]

});

}else{

/*
  إذا المشاركة غير مدعومة،
  ننزله مباشرة.
*/

const url =
URL.createObjectURL(
sticker.blob
);

const link =
document.createElement("a");

link.href = url;

link.download =
sticker.name;

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
2000
);

}

}catch(error){

if(
error.name !==
"AbortError"
){

console.error(error);

}

}

}


/* =========================
   عرض الملصقات
========================= */

function showStickers(){

stickersContainer.innerHTML = "";

resultSection.style.display =
"block";


stickers.forEach(
(sticker,index)=>{

const box =
document.createElement("div");

box.className =
"sticker";


const img =
document.createElement("img");

const url =
URL.createObjectURL(
sticker.blob
);

img.src = url;


const shareButton =
document.createElement("button");

shareButton.textContent =
"📤 مشاركة";


shareButton.addEventListener(
"click",
()=>{
shareSticker(
sticker,
index
);
});


const size =
document.createElement("div");

size.className =
"size";

size.textContent =
`${(sticker.blob.size / 1024).toFixed(1)} KB`;


box.appendChild(img);

box.appendChild(
shareButton
);

box.appendChild(size);

stickersContainer.appendChild(
box
);

});

}


/* =========================
   تحويل كل الصور
========================= */

convertBtn.addEventListener(
"click",
async function(){

if(files.length < 3){
return;
}


convertBtn.disabled = true;

stickers = [];

stickersContainer.innerHTML = "";

resultSection.style.display =
"none";


try{

for(
let i = 0;
i < files.length;
i++
){

status.textContent =
`جاري تحويل الملصق ${i + 1} من ${files.length}...`;


const blob =
await makeSticker(
files[i]
);


stickers.push({

name:
`sticker_${String(i + 1).padStart(2,"0")}.webp`,

blob:
blob

});

}


status.textContent =
"تم تحويل جميع الملصقات 🎀";


showStickers();


}catch(error){

console.error(error);

status.textContent =
"حدث خطأ أثناء التحويل.";

}


convertBtn.disabled = false;

});

</script>

</body>
</html>
