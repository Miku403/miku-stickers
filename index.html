<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(900px, 92%);
      margin: 35px auto;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 10px 0 28px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .title {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #packName {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }

    #packName:focus {
      border-color: #777;
    }

    .upload {
      position: relative;
      min-height: 155px;
      border: 2px dashed #aaa;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      transition: .2s;
    }

    .upload:active {
      transform: scale(.98);
    }

    .upload strong {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .upload span {
      color: #777;
      font-size: 14px;
    }

    #fileInput {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .count {
      text-align: center;
      font-weight: bold;
      margin-top: 16px;
    }

    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      background:
        linear-gradient(45deg, #eee 25%, transparent 25%),
        linear-gradient(-45deg, #eee 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eee 75%),
        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .number {
      position: absolute;
      top: 5px;
      right: 5px;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,.7);
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    #convertBtn {
      background: #222;
      color: white;
    }

    #downloadBtn {
      background: #25d366;
      color: white;
    }

    #shareBtn {
      background: #1677ff;
      color: white;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.6;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 14px;
      color: #666;
      line-height: 1.7;
      font-size: 14px;
    }

    .warning {
      margin-top: 12px;
      padding: 13px;
      background: #fff8e1;
      border-radius: 12px;
      color: #765900;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>

    <div class="subtitle">
      حوّل صورك إلى ملصقات واتساب 🎀
    </div>

    <div class="card">

      <label class="title" for="packName">
        اسم حزمة الملصقات
      </label>

      <input
        id="packName"
        type="text"
        placeholder="مثلاً: Miku Stickers"
        maxlength="40"
      >

      <label class="upload">

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
        >

        <strong>🖼️ اختر الصور</strong>

        <span>
          اختر من 3 إلى 30 صورة
        </span>

      </label>

      <div id="count" class="count"></div>

      <div id="preview" class="preview"></div>

      <button id="convertBtn" disabled>
        ⚙️ تحويل إلى ملصقات
      </button>

      <button id="downloadBtn" disabled>
        📦 تحميل الملصقات ZIP
      </button>

      <button id="shareBtn" disabled>
        📤 مشاركة الملصقات
      </button>

      <div id="status" class="status"></div>

      <div class="info">
        الملصقات يتم تحويلها إلى 512×512 WebP
        مع خلفية شفافة، مع محاولة ضغط كل ملصق
        إلى أقل من 100KB.
      </div>

      <div class="warning">
        ملاحظة: ملف ZIP هو ملف للصور المحوّلة،
        وليس ملفًا سحريًا يستورده واتساب مباشرة.
        واتساب يتيح حاليًا إنشاء وإدارة حزم الملصقات
        من داخل التطبيق.
      </div>

    </div>

  </div>


<script>

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const count =
  document.getElementById("count");

const convertBtn =
  document.getElementById("convertBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const shareBtn =
  document.getElementById("shareBtn");

const status =
  document.getElementById("status");

let files = [];
let stickers = [];


/* =========================================
   اختيار الصور
========================================= */

fileInput.addEventListener("change", () => {

  stickers = [];

  let selected =
    Array.from(fileInput.files || []);

  selected =
    selected.filter(file =>
      file.type.startsWith("image/")
    );

  if (selected.length > 30) {
    selected = selected.slice(0, 30);
  }

  files = selected;

  preview.innerHTML = "";

  downloadBtn.disabled = true;
  shareBtn.disabled = true;


  if (files.length === 0) {

    count.textContent = "";

    convertBtn.disabled = true;

    return;
  }


  count.textContent =
    `تم اختيار ${files.length} صورة`;


  if (files.length < 3) {

    count.textContent +=
      " — تحتاج 3 صور على الأقل";

    convertBtn.disabled = true;

  } else {

    convertBtn.disabled = false;

  }


  files.forEach((file, index) => {

    const item =
      document.createElement("div");

    item.className =
      "preview-item";


    const img =
      document.createElement("img");

    const url =
      URL.createObjectURL(file);

    img.src = url;

    img.onload = () => {
      URL.revokeObjectURL(url);
    };


    const number =
      document.createElement("div");

    number.className =
      "number";

    number.textContent =
      index + 1;


    item.appendChild(img);
    item.appendChild(number);

    preview.appendChild(item);

  });

  status.textContent = "";

});


/* =========================================
   إنشاء WebP بجودة معينة
========================================= */

async function canvasToWebP(canvas, quality) {

  return new Promise(resolve => {

    canvas.toBlob(
      blob => resolve(blob),
      "image/webp",
      quality
    );

  });

}


/* =========================================
   تحويل وضغط الملصق
========================================= */

async function makeSticker(file) {

  const image =
    await createImageBitmap(file);


  const canvas =
    document.createElement("canvas");

  canvas.width = 512;
  canvas.height = 512;


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(
    0,
    0,
    512,
    512
  );


  const scale =
    Math.min(
      512 / image.width,
      512 / image.height
    );


  const width =
    image.width * scale;

  const height =
    image.height * scale;


  const x =
    (512 - width) / 2;

  const y =
    (512 - height) / 2;


  ctx.drawImage(
    image,
    x,
    y,
    width,
    height
  );


  image.close();


  /*
    نحاول أولاً بجودة عالية،
    وإذا كان الملف أكبر من 100KB
    نقلل الجودة تدريجيًا.
  */

  const qualities = [
    0.90,
    0.82,
    0.75,
    0.68,
    0.60,
    0.52,
    0.45,
    0.38
  ];


  let blob = null;


  for (const quality of qualities) {

    blob =
      await canvasToWebP(
        canvas,
        quality
      );


    if (blob.size <= 100 * 1024) {
      break;
    }

  }


  return blob;

}


/* =========================================
   تحويل جميع الصور
========================================= */

convertBtn.addEventListener(
  "click",
  async () => {

    if (files.length < 3) {
      return;
    }


    convertBtn.disabled = true;
    downloadBtn.disabled = true;
    shareBtn.disabled = true;


    stickers = [];


    try {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        status.textContent =
          `جاري تحويل الملصق ${i + 1} من ${files.length}...`;


        const blob =
          await makeSticker(files[i]);


        stickers.push({
          name:
            `sticker_${String(i + 1).padStart(2, "0")}.webp`,

          blob:
            blob
        });

      }


      const overLimit =
        stickers.filter(
          sticker =>
            sticker.blob.size >
            100 * 1024
        );


      if (overLimit.length > 0) {

        status.textContent =
          `تم التحويل، لكن ${overLimit.length} ملصق تجاوز 100KB.`;

      } else {

        status.textContent =
          "تم تحويل جميع الملصقات بنجاح 🎀";

      }


      downloadBtn.disabled = false;

      shareBtn.disabled = false;


    } catch (error) {

      console.error(error);

      status.textContent =
        "حدث خطأ أثناء تحويل الصور.";

    }


    convertBtn.disabled = false;

  }
);


/* =========================================
   إنشاء ZIP
========================================= */

async function createZip() {

  const packName =
    document
      .getElementById("packName")
      .value
      .trim() ||
    "Miku Stickers";


  const zip =
    new JSZip();


  /*
    مجلد الملصقات
  */

  const folder =
    zip.folder(
      packName.replace(
        /[\\/:*?"<>|]/g,
        "_"
      )
    );


  stickers.forEach(sticker => {

    folder.file(
      sticker.name,
      sticker.blob
    );

  });


  /*
    ملف معلومات بسيط
  */

  folder.file(
    "README.txt",
    `𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚

Pack: ${packName}

Number of stickers: ${stickers.length}

Sticker size: 512x512
Format: WebP
`
  );


  return await zip.generateAsync({
    type: "blob"
  });

}


/* =========================================
   تحميل ZIP
========================================= */

downloadBtn.addEventListener(
  "click",
  async () => {

    if (!stickers.length) {
      return;
    }


    try {

      status.textContent =
        "جاري تجهيز ملف ZIP...";


      const blob =
        await createZip();


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");


      link.href = url;

      link.download =
        (
          document
            .getElementById("packName")
            .value
            .trim() ||
          "Miku Stickers"
        ).replace(
          /[\\/:*?"<>|]/g,
          "_"
        ) + ".zip";


      document.body.appendChild(link);

      link.click();

      link.remove();


      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 3000);


      status.textContent =
        "تم تحميل حزمة الملصقات 📦";


    } catch (error) {

      console.error(error);

      status.textContent =
        "حدث خطأ أثناء إنشاء الملف.";

    }

  }
);


/* =========================================
   مشاركة ZIP
========================================= */

shareBtn.addEventListener(
  "click",
  async () => {

    if (!stickers.length) {
      return;
    }


    try {

      status.textContent =
        "جاري تجهيز الملف للمشاركة...";


      const blob =
        await createZip();


      const packName =
        (
          document
            .getElementById("packName")
            .value
            .trim() ||
          "Miku Stickers"
        ).replace(
          /[\\/:*?"<>|]/g,
          "_"
        );


      const file =
        new File(
          [blob],
          `${packName}.zip`,
          {
            type:
              "application/zip"
          }
        );


      /*
        نتأكد أن الجهاز يدعم
        المشاركة بالملفات.
      */

      if (
        navigator.share &&
        (!navigator.canShare ||
         navigator.canShare({
           files: [file]
         }))
      ) {

        await navigator.share({
          title:
            packName,

          text:
            "حزمة ملصقات من 𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚",

          files: [file]
        });


        status.textContent =
          "تم فتح قائمة المشاركة 📤";


      } else {

        status.textContent =
          "المشاركة بالملفات غير مدعومة في هذا المتصفح. استخدم زر التحميل.";

      }


    } catch (error) {

      console.error(error);


      if (
        error.name ===
        "AbortError"
      ) {

        status.textContent =
          "تم إلغاء المشاركة.";

      } else {

        status.textContent =
          "تعذر مشاركة الملف.";

      }

    }

  }
);


/* =========================================
   إخفاء زر المشاركة إذا غير مدعوم
========================================= */

if (!navigator.share) {

  shareBtn.style.display =
    "none";

}

</script>

</body>
</html>
