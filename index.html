<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="Miku Stickers - تحويل الصور إلى ملصقات WhatsApp"
  >

  <title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <main class="container">

    <header>
      <h1>
        𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚
      </h1>

      <p>
        حوّل صورك إلى ملصقات WhatsApp
      </p>
    </header>


    <section class="card">

      <!-- اسم الحزمة -->

      <div class="field">

        <label for="packName">
          اسم حزمة الملصقات
        </label>

        <input
          id="packName"
          type="text"
          maxlength="64"
          autocomplete="off"
          placeholder="Miku Stickers"
        >

      </div>


      <!-- رفع الصور -->

      <label
        class="upload"
        for="fileInput"
      >

        <span class="upload-icon">
          ＋
        </span>

        <span>
          اختر من 3 إلى 30 صورة
        </span>

        <small>
          PNG / JPG / WEBP
        </small>

      </label>


      <input
        id="fileInput"
        type="file"
        accept="image/*"
        multiple
        hidden
      >


      <!-- الحالة -->

      <div
        id="status"
        class="status"
        aria-live="polite"
      >
        اختر من 3 إلى 30 صورة.
      </div>


      <!-- المعاينة -->

      <section
        id="preview"
        class="preview"
        aria-label="معاينة الملصقات"
      ></section>


      <!-- إنشاء الحزمة -->

      <button
        id="createButton"
        type="button"
        disabled
      >
        إنشاء حزمة الملصقات
      </button>


      <!-- حالة الـ Bridge -->

      <div
        id="bridgeStatus"
        class="bridge-status"
        aria-live="polite"
      >
        Miku Stickers جاهز.
      </div>


      <!-- WhatsApp -->

      <button
        id="whatsappButton"
        class="secondary"
        type="button"
        disabled
      >
        إضافة إلى WhatsApp
      </button>

    </section>


    <!-- معلومات -->

    <section class="info">

      <div class="info-item">

        <strong>
          512×512
        </strong>

        <span>
          أبعاد الملصق
        </span>

      </div>


      <div class="info-item">

        <strong>
          ≤ 100KB
        </strong>

        <span>
          حجم الملصق
        </span>

      </div>


      <div class="info-item">

        <strong>
          3–30
        </strong>

        <span>
          عدد الملصقات
        </span>

      </div>

    </section>


    <footer>

      <p>
        𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚
      </p>

    </footer>

  </main>


  <!-- مهم:
       لا نستخدم type="module" هنا
       لتجنب مشكلة التحميل السابقة.
  -->

    <script type="module" src="js/app.js"></script>

</body>

</html>
