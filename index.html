<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #dffaff, #ffffff, #f4e8ff);
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    header {
      text-align: center;
      padding: 25px 0;
    }

    .logo {
      direction: ltr;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 10px;
      color: #777;
    }

    .card {
      background: rgba(255,255,255,.85);
      border-radius: 25px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    .upload {
      margin-top: 20px;
      padding: 35px 15px;
      text-align: center;
      border: 2px dashed #82d9e8;
      border-radius: 20px;
      background: #f5fdff;
      cursor: pointer;
    }

    .upload strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .upload span {
      color: #777;
      font-size: 13px;
    }

    #fileInput {
      display: none;
    }

    .preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .download {
      background: #eaf8fa;
      color: #222;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      color: #666;
      font-size: 14px;
      min-height: 20px;
    }

    .info {
      margin-top: 15px;
      color: #777;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 450px) {
      .logo {
        font-size: 25px;
      }

      .preview {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</div>
    <div class="subtitle">
      حوّل صورك إلى ملصقات واتساب 🎀
    </div>
  </header>

  <div class="card">

    <label>اسم حزمة الملصقات</label>

    <input
      id="packName"
      type="text"
      placeholder="مثال: Miku Stickers 🎀"
    >

    <label style="margin-top:20px;">
      اختر الصور
    </label>

    <div class="upload" id="uploadBox">

      <strong>
        🖼️ اختر الصور من الآيفون
      </strong>

      <span>
        يمكنك اختيار عدة صور دفعة واحدة
      </span>

    </div>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >

    <div id="preview" class="preview"></div>

    <button id="convertBtn" disabled>
      🔄 تحويل الصور إلى ملصقات
    </button>

    <button
      id="downloadBtn"
      class="download"
      disabled
    >
      📦 تنزيل حزمة الملصقات
    </button>

    <div id="status" class="status"></div>

    <div class="info">
      تتم معالجة الصور داخل المتصفح.
      كل صورة يتم تجهيزها بمقاس 512×512 وبصيغة WebP.
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>

const fileInput =
  document.getElementById("fileInput");

const uploadBox =
  document.getElementById("uploadBox");

const preview =
  document.getElementById("preview");

const convertBtn =
  document.getElementById("convertBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const status =
  document.getElementById("status");

let selectedFiles = [];
let convertedFiles = [];


uploadBox.onclick = () => {
  fileInput.click();
};


fileInput.onchange = () => {

  selectedFiles =
    Array.from(fileInput.files)
      .filter(file => file.type.startsWith("image/"));

  convertedFiles = [];

  preview.innerHTML = "";

  selectedFiles.forEach(file => {

    const img = document.createElement("img");

    img.src = URL.createObjectURL(file);

    preview.appendChild(img);

  });

  convertBtn.disabled =
    selectedFiles.length === 0;

  downloadBtn.disabled = true;

  if (selectedFiles.length) {

    status.textContent =
      `تم اختيار ${selectedFiles.length} صورة`;

  } else {

    status.textContent = "";

  }

};


async function convertImage(file) {

  const image =
    await createImageBitmap(file);

  const canvas =
    document.createElement("canvas");

  canvas.width = 512;
  canvas.height = 512;

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(0, 0, 512, 512);

  const scale =
    Math.min(
      512 / image.width,
      512 / image.height
    );

  const width =
    image.width * scale;

  const height =
    image.height * scale;

  const x =
    (512 - width) / 2;

  const y =
    (512 - height) / 2;

  ctx.drawImage(
    image,
    x,
    y,
    width,
    height
  );

  image.close();

  return new Promise(resolve => {

    canvas.toBlob(
      blob => resolve(blob),
      "image/webp",
      0.9
    );

  });

}


convertBtn.onclick = async () => {

  convertBtn.disabled = true;

  downloadBtn.disabled = true;

  convertedFiles = [];

  for (
    let i = 0;
    i < selectedFiles.length;
    i++
  ) {

    status.textContent =
      `جاري تحويل الصورة ${i + 1} من ${selectedFiles.length}...`;

    const blob =
      await convertImage(selectedFiles[i]);

    convertedFiles.push({
      name:
        `sticker_${String(i + 1).padStart(2, "0")}.webp`,
      blob: blob
    });

  }

  status.textContent =
    `تم تحويل ${convertedFiles.length} ملصق ✨`;

  convertBtn.disabled = false;

  downloadBtn.disabled = false;

};


downloadBtn.onclick = async () => {

  const zip = new JSZip();

  const packName =
    document.getElementById("packName")
      .value
      .trim() ||
    "Miku Stickers";

  const folder =
    zip.folder("stickers");

  convertedFiles.forEach(file => {

    folder.file(
      file.name,
      file.blob
    );

  });

  status.textContent =
    "جاري تجهيز الحزمة...";

  const zipBlob =
    await zip.generateAsync({
      type: "blob"
    });

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(zipBlob);

  link.download =
    packName
      .replace(/[\\/:*?"<>|]/g, "_")
      + "_stickers.zip";

  link.click();

  status.textContent =
    "تم تجهيز الحزمة 📦🎀";

};


</script>

</body>
</html>
