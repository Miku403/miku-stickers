<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    label.title {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #packName {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .upload {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      border: 2px dashed #aaa;
      border-radius: 18px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .upload:active {
      transform: scale(0.98);
    }

    .upload strong {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .upload span {
      color: #777;
    }

    /* نخلي input يغطي منطقة الرفع كاملة */
    #fileInput {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .count {
      text-align: center;
      margin: 12px 0;
      font-weight: bold;
    }

    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      background: #f0f0f0;
      border-radius: 14px;
      overflow: hidden;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    #convertBtn {
      background: #222;
      color: white;
    }

    #downloadBtn {
      background: #25d366;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 14px;
      color: #666;
      line-height: 1.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>

    <div class="subtitle">
      حوّل صورك إلى ملصقات 🎀
    </div>

    <div class="card">

      <label class="title" for="packName">
        اسم حزمة الملصقات
      </label>

      <input
        id="packName"
        type="text"
        placeholder="مثلاً: Miku Stickers"
      >

      <!-- زر اختيار الصور -->
      <label class="upload">

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
        >

        <strong>🖼️ اختر الصور</strong>

        <span>
          من 3 إلى 30 صورة
        </span>

      </label>

      <div id="count" class="count"></div>

      <div id="preview" class="preview"></div>

      <button id="convertBtn" disabled>
        تحويل إلى ملصقات
      </button>

      <button id="downloadBtn" disabled>
        تحميل حزمة الملصقات
      </button>

      <div id="status" class="status"></div>

      <div class="info">
        يتم تحويل الصور إلى WebP بحجم 512×512
        مع خلفية شفافة، ثم وضعها داخل ملف الحزمة.
      </div>

    </div>

  </div>


  <script>

    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");
    const count = document.getElementById("count");

    const convertBtn = document.getElementById("convertBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    const status = document.getElementById("status");

    let files = [];
    let stickers = [];


    /* =========================
       اختيار الصور
    ========================= */

    fileInput.addEventListener("change", function () {

      stickers = [];

      const selected = Array.from(fileInput.files || []);

      files = selected.filter(file =>
        file.type.startsWith("image/")
      );

      preview.innerHTML = "";

      if (files.length === 0) {

        count.textContent = "";

        convertBtn.disabled = true;
        downloadBtn.disabled = true;

        return;
      }


      if (files.length < 3) {

        count.textContent =
          `تم اختيار ${files.length} صور — اختر 3 صور على الأقل`;

        convertBtn.disabled = true;

      } else if (files.length > 30) {

        count.textContent =
          "الحد الأقصى هو 30 صورة";

        files = files.slice(0, 30);

        convertBtn.disabled = false;

      } else {

        count.textContent =
          `تم اختيار ${files.length} صورة`;

        convertBtn.disabled = false;
      }


      /* عرض الصور */

      files.forEach(file => {

        const item = document.createElement("div");
        item.className = "preview-item";

        const img = document.createElement("img");

        img.src = URL.createObjectURL(file);

        img.onload = () => {
          URL.revokeObjectURL(img.src);
        };

        item.appendChild(img);

        preview.appendChild(item);

      });

      status.textContent = "";

    });


    /* =========================
       تحويل الصورة إلى WebP
    ========================= */

    async function makeSticker(file) {

      const image = await createImageBitmap(file);

      const canvas = document.createElement("canvas");

      canvas.width = 512;
      canvas.height = 512;

      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 512, 512);


      const scale = Math.min(
        512 / image.width,
        512 / image.height
      );

      const width = image.width * scale;
      const height = image.height * scale;

      const x = (512 - width) / 2;
      const y = (512 - height) / 2;


      ctx.drawImage(
        image,
        x,
        y,
        width,
        height
      );


      image.close();


      const blob = await new Promise(resolve => {

        canvas.toBlob(
          resolve,
          "image/webp",
          0.9
        );

      });


      return blob;
    }


    /* =========================
       تحويل جميع الصور
    ========================= */

    convertBtn.addEventListener("click", async function () {

      if (!files.length) return;


      convertBtn.disabled = true;
      downloadBtn.disabled = true;

      stickers = [];


      try {

        for (let i = 0; i < files.length; i++) {

          status.textContent =
            `جاري تحويل الصورة ${i + 1} من ${files.length}...`;

          const blob =
            await makeSticker(files[i]);


          const name =
            `sticker_${String(i + 1).padStart(2, "0")}.webp`;


          stickers.push({
            name: name,
            blob: blob
          });

        }


        status.textContent =
          "تم تحويل جميع الصور بنجاح 🎀";

        downloadBtn.disabled = false;


      } catch (error) {

        console.error(error);

        status.textContent =
          "حدث خطأ أثناء تحويل الصور.";

      }


      convertBtn.disabled = false;

    });


    /* =========================
       إنشاء الحزمة
    ========================= */

    downloadBtn.addEventListener("click", async function () {

      if (!stickers.length) return;


      try {

        const packName =
          document
            .getElementById("packName")
            .value
            .trim() ||
          "Miku Stickers";


        const authorName =
          "𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚";


        const zip = new JSZip();


        /* معلومات الحزمة */

        zip.file(
          "title.txt",
          packName
        );

        zip.file(
          "author.txt",
          authorName
        );


        /* إضافة الملصقات */

        stickers.forEach(sticker => {

          zip.file(
            sticker.name,
            sticker.blob
          );

        });


        /* =========================
           إنشاء صورة الغلاف
        ========================= */

        const firstFile = files[0];

        const image =
          await createImageBitmap(firstFile);


        const canvas =
          document.createElement("canvas");

        canvas.width = 96;
        canvas.height = 96;


        const ctx =
          canvas.getContext("2d");


        ctx.clearRect(
          0,
          0,
          96,
          96
        );


        const scale = Math.min(
          96 / image.width,
          96 / image.height
        );


        const width =
          image.width * scale;

        const height =
          image.height * scale;


        const x =
          (96 - width) / 2;

        const y =
          (96 - height) / 2;


        ctx.drawImage(
          image,
          x,
          y,
          width,
          height
        );


        image.close();


        const coverBlob =
          await new Promise(resolve => {

            canvas.toBlob(
              blob => resolve(blob),
              "image/png"
            );

          });


        zip.file(
          "tray.png",
          coverBlob
        );


        /* =========================
           إنشاء الملف
        ========================= */

        status.textContent =
          "جاري إنشاء ملف الملصقات...";


        const wastickerBlob =
          await zip.generateAsync({
            type: "blob"
          });


        const url =
          URL.createObjectURL(
            wastickerBlob
          );


        const link =
          document.createElement("a");

        link.href = url;

        link.download =
          packName
            .replace(/[\\/:*?"<>|]/g, "_")
            + ".wasticker";


        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(() => {

          URL.revokeObjectURL(url);

        }, 3000);


        status.textContent =
          "تم إنشاء ملف .wasticker 🎀";


      } catch (error) {

        console.error(error);

        status.textContent =
          "حدث خطأ أثناء إنشاء الحزمة.";

      }

    });

  </script>

</body>
</html>
