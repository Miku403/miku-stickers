<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:Arial,sans-serif;
}

.container{
  width:min(900px,92%);
  margin:30px auto;
}

h1{
  text-align:center;
  font-size:32px;
  margin:0;
}

.subtitle{
  text-align:center;
  color:#777;
  margin:10px 0 25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.title{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

#packName{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:18px;
}

.upload{
  position:relative;
  min-height:150px;
  border:2px dashed #aaa;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  overflow:hidden;
}

.upload strong{
  font-size:20px;
  margin-bottom:8px;
}

.upload span{
  color:#777;
}

#fileInput{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
}

.count{
  text-align:center;
  font-weight:bold;
  margin:15px 0;
}

.preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.preview-item{
  aspect-ratio:1;
  border-radius:14px;
  overflow:hidden;
  background:#eee;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:contain;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

#convertBtn{
  background:#222;
  color:white;
}

#packBtn{
  background:#16883b;
  color:white;
}

button:disabled{
  opacity:.45;
}

.status{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}

/* النتائج */

#resultSection{
  display:none;
  margin-top:25px;
}

.resultTitle{
  font-size:21px;
  font-weight:bold;
  margin-bottom:12px;
}

.stickers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.sticker{
  background:#f2f2f2;
  border-radius:16px;
  padding:8px;
  text-align:center;
}

.sticker img{
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
  display:block;
  border-radius:10px;
}

.sticker button{
  margin-top:8px;
  padding:10px;
  font-size:14px;
  background:#1677ff;
  color:white;
}

.size{
  font-size:11px;
  color:#777;
  margin-top:5px;
}

.info{
  margin-top:20px;
  padding:14px;
  border-radius:13px;
  background:#f7f7f7;
  color:#666;
  font-size:13px;
  line-height:1.7;
}

.packInfo{
  margin-top:15px;
  padding:14px;
  border-radius:13px;
  background:#eefaf1;
  color:#276438;
  font-size:13px;
  line-height:1.7;
}
</style>
</head>

<body>

<div class="container">

<h1>𝘔𝘐𝘒𝘜 𝘚𝘛𝘐𝘊𝘒𝘌𝘙𝘚</h1>

<div class="subtitle">
حوّل صورك إلى ملصقات 🎀
</div>

<div class="card">

<label class="title">
اسم حزمة الملصقات
</label>

<input
id="packName"
type="text"
placeholder="مثلاً: Miku Stickers"
maxlength="128"
>

<label class="upload">

<input
id="fileInput"
type="file"
accept="image/*"
multiple
>

<strong>🖼️ اختر الصور</strong>

<span>
من 3 إلى 30 صورة
</span>

</label>

<div id="count" class="count"></div>

<div id="preview" class="preview"></div>

<button
id="convertBtn"
disabled>
⚙️ تحويل إلى ملصقات
</button>

<button
id="packBtn"
disabled>
🎀 إنشاء حزمة .wastickers
</button>

<div id="status" class="status"></div>

<div id="resultSection">

<div class="resultTitle">
🎀 ملصقاتك الجاهزة
</div>

<div id="stickers" class="stickers"></div>

<div class="packInfo">
الحزمة تحتوي على:
<br>
• ملصقات WebP بحجم 512×512
<br>
• ملف غلاف PNG بحجم 96×96
<br>
• اسم الحزمة
<br>
• اسم الناشر
</div>

</div>

<div class="info">

كل ملصق يتم تحويله إلى
512×512 WebP وبحد أقصى 100KB.

بعد إنشاء الحزمة اضغط
<strong>إنشاء حزمة .wastickers</strong>
لتحميلها.

</div>

</div>

</div>


<script>

const fileInput =
document.getElementById("fileInput");

const packName =
document.getElementById("packName");

const preview =
document.getElementById("preview");

const count =
document.getElementById("count");

const convertBtn =
document.getElementById("convertBtn");

const packBtn =
document.getElementById("packBtn");

const status =
document.getElementById("status");

const resultSection =
document.getElementById("resultSection");

const stickersContainer =
document.getElementById("stickers");


let files = [];
let stickers = [];


/* =========================
   اختيار الصور
========================= */

fileInput.addEventListener(
"change",
function(){

let selected =
Array.from(
fileInput.files || []
);

selected =
selected.filter(
file =>
file.type.startsWith("image/")
);

if(selected.length > 30){

selected =
selected.slice(0,30);

}

files = selected;

preview.innerHTML = "";

stickersContainer.innerHTML = "";

resultSection.style.display =
"none";

packBtn.disabled = true;


if(files.length === 0){

count.textContent = "";

convertBtn.disabled = true;

return;

}


count.textContent =
`تم اختيار ${files.length} صورة`;


if(files.length < 3){

count.textContent +=
" — اختر 3 صور على الأقل";

convertBtn.disabled = true;

}else{

convertBtn.disabled = false;

}


files.forEach(
file => {

const item =
document.createElement("div");

item.className =
"preview-item";


const img =
document.createElement("img");

const url =
URL.createObjectURL(file);

img.src = url;

img.onload = () => {

URL.revokeObjectURL(url);

};


item.appendChild(img);

preview.appendChild(item);

});

});


/* =========================
   تحويل الصورة إلى WebP
========================= */

async function makeSticker(file){

const image =
await createImageBitmap(file);

const canvas =
document.createElement("canvas");

canvas.width = 512;
canvas.height = 512;

const ctx =
canvas.getContext("2d");

ctx.clearRect(
0,
0,
512,
512
);


/*
  نفس فكرة المشروع المرجعي:
  نترك هامش 16px.
*/

const margin = 16;

const inner =
512 - margin * 2;

const scale =
Math.min(
inner / image.width,
inner / image.height
);

const width =
image.width * scale;

const height =
image.height * scale;

const x =
(512 - width) / 2;

const y =
(512 - height) / 2;


ctx.drawImage(
image,
x,
y,
width,
height
);

image.close();


/*
  نحاول النزول تحت 100KB
*/

let quality = 0.90;

let blob = null;

while(
quality >= 0.20
){

blob =
await new Promise(
resolve => {

canvas.toBlob(
result =>
resolve(result),
"image/webp",
quality
);

});

if(
blob &&
blob.size <=
100 * 1024
){

return blob;

}

quality -= 0.04;

}


/*
  إذا لم نصل إلى 100KB
*/

if(
blob &&
blob.size > 100 * 1024
){

throw new Error(
`الصورة حجمها أكبر من 100KB حتى بعد الضغط`
);

}

throw new Error(
"فشل تحويل الصورة"
);

}


/* =========================
   تحويل الغلاف
========================= */

async function makeCover(file){

const image =
await createImageBitmap(file);

const canvas =
document.createElement("canvas");

canvas.width = 96;
canvas.height = 96;

const ctx =
canvas.getContext("2d");

ctx.clearRect(
0,
0,
96,
96
);

const scale =
Math.min(
96 / image.width,
96 / image.height
);

const width =
image.width * scale;

const height =
image.height * scale;

const x =
(96 - width) / 2;

const y =
(96 - height) / 2;


ctx.drawImage(
image,
x,
y,
width,
height
);

image.close();


let blob =
await new Promise(
resolve => {

canvas.toBlob(
result =>
resolve(result),
"image/png"
);

});


/*
  إذا كان الغلاف أكبر من 50KB
  نصغره مرة أخرى.
*/

if(
blob.size <=
50 * 1024
){

return blob;

}


const small =
document.createElement("canvas");

small.width = 72;
small.height = 72;

small.getContext("2d")
.drawImage(
canvas,
0,
0,
72,
72
);


blob =
await new Promise(
resolve => {

small.toBlob(
result =>
resolve(result),
"image/png"
);

});

return blob;

}


/* =========================
   عرض الملصقات
========================= */

function showStickers(){

stickersContainer.innerHTML = "";

resultSection.style.display =
"block";


stickers.forEach(
(sticker,index)=>{

const box =
document.createElement("div");

box.className =
"sticker";


const img =
document.createElement("img");

const url =
URL.createObjectURL(
sticker.blob
);

img.src = url;


const shareButton =
document.createElement("button");

shareButton.textContent =
"📤 مشاركة";


shareButton.addEventListener(
"click",
()=>{
shareSticker(
sticker,
index
);
});


const size =
document.createElement("div");

size.className =
"size";

size.textContent =
`${(sticker.blob.size / 1024).toFixed(1)} KB`;


box.appendChild(img);

box.appendChild(
shareButton
);

box.appendChild(size);

stickersContainer.appendChild(
box
);

});

}


/* =========================
   مشاركة ملصق
========================= */

async function shareSticker(
sticker,
index
){

const file =
new File(
[sticker.blob],
sticker.name,
{
type:"image/webp"
}
);


try{

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

title:
`Sticker ${index + 1}`,

files:[file]

});

}else{

const url =
URL.createObjectURL(
sticker.blob
);

const link =
document.createElement("a");

link.href = url;

link.download =
sticker.name;

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
2000
);

}

}catch(error){

if(
error.name !==
"AbortError"
){

console.error(error);

}

}

}


/* =========================
   تحويل كل الصور
========================= */

convertBtn.addEventListener(
"click",
async function(){

if(files.length < 3){
return;
}


convertBtn.disabled = true;

packBtn.disabled = true;

stickers = [];

stickersContainer.innerHTML = "";

resultSection.style.display =
"none";


try{

for(
let i = 0;
i < files.length;
i++
){

status.textContent =
`جاري تحويل الملصق ${i + 1} من ${files.length}...`;


const blob =
await makeSticker(
files[i]
);


stickers.push({

name:
`${Math.floor(Date.now()/1000) + i + 1}.webp`,

blob:
blob

});

}


status.textContent =
"تم تحويل جميع الملصقات 🎀";


showStickers();

packBtn.disabled = false;


}catch(error){

console.error(error);

status.textContent =
"حدث خطأ: " +
error.message;

}


convertBtn.disabled = false;

});


/* =========================
   إنشاء حزمة .wastickers
========================= */

packBtn.addEventListener(
"click",
async function(){

if(stickers.length < 3){
return;
}


let title =
packName.value.trim();

if(!title){

title =
"Miku Stickers";

}


packBtn.disabled = true;

status.textContent =
"🎀 جاري إنشاء حزمة .wastickers...";


try{

const zip =
new JSZip();


/*
  هذه هي بنية المشروع المرجعي:
  title.txt
  author.txt
  cover.png
  3.webp
  4.webp
  ...
*/

zip.file(
"title.txt",
title
);

zip.file(
"author.txt",
"Miku Stickers"
);


/*
  أول صورة تصبح الغلاف
*/

const cover =
await makeCover(
files[0]
);

zip.file(
"cover.png",
cover
);


/*
  إضافة الملصقات
*/

let timestamp =
Math.floor(
Date.now() / 1000
);


for(
let i = 0;
i < stickers.length;
i++
){

status.textContent =
`📦 إضافة الملصق ${i + 1} من ${stickers.length}...`;


const sticker =
stickers[i];


/*
  نفس نمط المشروع المرجعي:
  أسماء رقمية متسلسلة
*/

zip.file(
`${timestamp + i + 1}.webp`,
sticker.blob
);

}


/*
  إنشاء الملف النهائي
*/

status.textContent =
"📦 ضغط الحزمة...";


const wastickers =
await zip.generateAsync({

type:"blob",

compression:"DEFLATE",

compressionOptions:{
level:6
}

});


/*
  تنزيل الملف بامتداد .wastickers
*/

const url =
URL.createObjectURL(
wastickers
);

const link =
document.createElement("a");

link.href = url;

link.download =
`${slugify(title)}.wastickers`;

document.body.appendChild(link);

link.click();

link.remove();


setTimeout(
()=>{
URL.revokeObjectURL(url);
},
3000
);


status.textContent =
"✅ تم إنشاء حزمة .wastickers بنجاح 🎀";


}catch(error){

console.error(error);

status.textContent =
"❌ فشل إنشاء الحزمة: " +
error.message;

}


packBtn.disabled = false;

});


/* =========================
   اسم الملف
========================= */

function slugify(text){

return text
.toLowerCase()
.trim()
.replace(/[^a-z0-9._ -]/g,"")
.replace(/\s+/g,"_")
.replace(/_+/g,"_")
.slice(0,64)
||
"miku_stickers";

}

</script>

</body>
</html>
